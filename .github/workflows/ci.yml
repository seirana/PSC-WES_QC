name: Python CI

on:
  push:
    branches: [main, quality-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core package
        run: python -m pip install -e .
      - name: Run synthetic QC tests
        run: python -m unittest discover -s tests -v
      - name: Check package compiles
        run: python -m compileall -q src/wes_qc
