[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psc-wes-qc"
version = "0.1.0"
description = "Cohort-aware quality control for PLINK WES genotypes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
plink = ["pandas-plink"]

[project.scripts]
wes-qc = "wes_qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
